[project]
name = "humanitys-last-quiz"
version = "0.1.0"
description = "A weekly broadsheet almanac of pub-quiz staples, generated every Sunday from the week just gone."
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "requests>=2.31",
    "google-genai>=3.3",
    "beautifulsoup4>=4.12",
]

[project.scripts]
hlq = "hlq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
